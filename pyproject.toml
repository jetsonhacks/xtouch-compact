[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xtouch-compact"
dynamic = ["version"]
description = "Python library for the Behringer X-TOUCH COMPACT on Linux ALSA Sequencer, in Standard MIDI mode"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "JetsonHacks" }]
keywords = ["midi", "alsa", "linux", "behringer", "x-touch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
]
dependencies = [
    "alsa-midi>=1.0.4",
    "PyYAML>=6.0.2",
]

[project.urls]
Homepage = "https://github.com/jetsonhacks/xtouch-compact"
Repository = "https://github.com/jetsonhacks/xtouch-compact"
Issues = "https://github.com/jetsonhacks/xtouch-compact/issues"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.11",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.hatch.version]
path = "src/xtouch_compact/__init__.py"

[tool.hatch.build.targets.sdist]
only-include = [
    "src/xtouch_compact",
    "specs/xtouch-compact-midi.yaml",
    "tests",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xtouch_compact"]

[tool.hatch.build.targets.wheel.force-include]
"specs/xtouch-compact-midi.yaml" = "xtouch_compact/data/xtouch-compact-midi.yaml"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["xtouch_compact"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
packages = ["xtouch_compact"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "alsa_midi.*"
ignore_missing_imports = true
